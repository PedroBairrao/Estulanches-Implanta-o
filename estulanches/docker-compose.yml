services:
  db:
    image: postgres:16-alpine
    container_name: estulanches-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-estu}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-troque_esta_senha}
      POSTGRES_DB: ${DB_NAME:-estulanches}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [interna]          # sem porta publicada: só a app acessa o banco
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-estu} -d ${DB_NAME:-estulanches}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: estulanches-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      APP_VERSION: 1.0.0
      DATABASE_URL: postgres://${DB_USER:-estu}:${DB_PASSWORD:-troque_esta_senha}@db:5432/${DB_NAME:-estulanches}
    ports:
      - "3000:3000"
    networks: [interna]

volumes:
  pgdata:

networks:
  interna:
